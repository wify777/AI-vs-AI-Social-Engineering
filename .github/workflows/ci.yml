name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check critical Python errors
        run: ruff check .
      - name: Check formatting of new verifier and tests
        run: ruff format --check evaluation/verify_dataset.py tests
      - name: Offline tests with network sockets disabled
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Verify historical archive counts
        run: python -m evaluation.verify_dataset
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check installed wheel entry point
        shell: bash
        run: |
          python -m venv /tmp/agenttrust-wheel-check
          /tmp/agenttrust-wheel-check/bin/pip install --no-deps dist/*.whl
          /tmp/agenttrust-wheel-check/bin/agenttrust-verify --root "$GITHUB_WORKSPACE"
      - name: Save coverage and package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-python-${{ matrix.python-version }}
          path: |
            coverage.xml
            dist/*
          if-no-files-found: error
          retention-days: 7

  container:
    name: Offline container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and run the archive verifier without network access
        run: docker compose up --build --abort-on-container-exit --exit-code-from verify
