<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" viewBox="0 0 1040 490" role="img" aria-labelledby="title desc">
<title id="title">AgentTrust architecture</title>
<desc id="desc">Payloads flow through the experiment runner and message bus to a Parser, an Admin and local stub tools. Both agents call model providers. The runner records JSONL, which feeds offline verification and analysis.</desc>
